[project]
name = "studyloop"
version = "0.1.0"
description = "A minimal, inspectable study agent: materials -> notes -> quiz, plus weekly review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yangu4040" }]
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
anthropic = ["anthropic>=0.40"]
dev = []

[project.scripts]
studyloop = "studyloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studyloop"]
